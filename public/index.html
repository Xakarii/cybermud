<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>cyberMUD // Night City</title>
<style>
  /* Lock the body down so the whole webpage can never scroll */
  html, body { 
    margin: 0; 
    height: 100%; 
    background: #0a0a0f; 
    color: #c8f7ff; 
    font-family: 'Courier New', monospace; 
    overflow: hidden; 
  }
  
  /* Use a flexbox column to pin the main display window above the bottom action bar */
  body {
    display: flex;
    flex-direction: column;
  }

  /* The primary container holds both the left map view and the right chat pane side-by-side */
  #game-container {
    display: flex;
    flex: 1;
    height: calc(100vh - 44px);
    overflow: hidden;
  }

  /* Left Side: Fixed layout map viewport container box */
  #map-viewport {
    width: 380px;
    border-right: 1px solid #ff2f8e;
    padding: 12px;
    white-space: pre;
    font-family: 'Courier New', monospace; /* Locks letter alignment */
    font-size: 16px;                       /* Makes characters crisp */
    letter-spacing: 2px;                  /* Squares out your grid perfectly */
    line-height: 1.2;
    background: #0a0a0f;
    overflow: hidden;
    box-sizing: border-box;  /* Ensures padding doesn't push width to 404px */
    text-overflow: ellipsis; /* Appends "..." if any text overflows the 380px mark */
    max-width: 380px;        /* Strict hard physical layout stop */
  }

   /* Right Side: Scrollable text logs screen channel console log */
  #screen { 
    flex: 1;
    padding: 12px; 
    overflow-y: auto;            /* Forces scrollbars to appear here inside the container */
    max-height: 100%;            /* Restricts the window from stretching the page boundaries */
    box-sizing: border-box;       /* Keeps paddings cleanly calculated inside constraints */
    white-space: pre-wrap;        /* Allows long global logs messages to wrap nicely */
    font-size: 14px; 
    line-height: 1.3; 
  }


  #screen::-webkit-scrollbar { width: 8px; } 
  #screen::-webkit-scrollbar-thumb { background: #ff2f8e; }
  
  /* Bottom command terminal layout line bar frame input tray */
  #bar { 
    display: flex; 
    height: 44px; 
    border-top: 1px solid #ff2f8e; 
    background: #05050a;
  }
  #prompt { color: #ff2f8e; padding: 0 12px; line-height: 44px; font-weight: bold; }
  #input { flex: 1; background: transparent; color: #7fffd4; border: none; outline: none; font-family: inherit; font-size: 14px; }
</style>
</head>
<body>
  
  <!-- Side-by-side interface viewport grid layout setup -->
  <div id="game-container">
    <div id="map-viewport">--- MAP ---</div>
    <div id="screen"></div>
  </div>

  <!-- Bottom interactive entry system dock terminal shell frame -->
  <div id="bar">
    <span id="prompt">▶</span>
    <input id="input" autocomplete="off" autofocus />
  </div>

  <script src="client.js"></script>
</body>
</html>

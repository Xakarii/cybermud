<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>cyberMUD // Night City</title>
<style>
  /* Lock the body down so the whole webpage can never scroll */
  html, body { 
    margin: 0; 
    height: 100%; 
    background: #0a0a0f; 
    color: #c8f7ff; 
    font-family: 'Courier New', monospace; 
    overflow: hidden; 
  }
  
  /* Use a flexbox column to pin the main display window above the bottom action bar */
  body {
    display: flex;
    flex-direction: column;
  }

  /* The primary container holds both the left map view and the right chat pane side-by-side */
  #game-container {
    display: flex;
    flex: 1;
    height: calc(100vh - 44px);
    overflow: hidden;
  }
/*
  #map-viewport {
    width: 260px;
    border-right: 1px solid #ff2f8e;
    padding: 12px;
    white-space: pre;
    font-size: 14px;
    line-height: 1.15;
    background: #0d0d14;
  }
*/
    /* Left Side: Fixed layout map viewport container box */
  #map-viewport {
    width: 280px; /* Bumped up slightly to fit your 11x11 viewport radius nicely */
    border-right: 1px solid #ff2f8e;
    padding: 12px;
    white-space: pre;
    font-size: 14px;
    line-height: 1.15;
    background: #0d0d14;
    overflow: hidden; /* Prevents rogue text elements from leaking downwards */
  }

  /* Right Side: Scrollable text logs screen channel console log */
  #screen { 
    flex: 1;
    padding: 12px; 
    overflow-y: auto; 
    white-space: pre-wrap; /* Allows long global logs messages to wrap nicely */
    font-size: 14px; 
    line-height: 1.3; 
  }

  #screen::-webkit-scrollbar { width: 8px; } 
  #screen::-webkit-scrollbar-thumb { background: #ff2f8e; }
  
  /* Bottom command terminal layout line bar frame input tray */
  #bar { 
    display: flex; 
    height: 44px; 
    border-top: 1px solid #ff2f8e; 
    background: #05050a;
  }
  #prompt { color: #ff2f8e; padding: 0 12px; line-height: 44px; font-weight: bold; }
  #input { flex: 1; background: transparent; color: #7fffd4; border: none; outline: none; font-family: inherit; font-size: 14px; }
</style>
</head>
<body>
  
  <!-- Side-by-side interface viewport grid layout setup -->
  <div id="game-container">
    <div id="map-viewport">--- MAP ---</div>
    <div id="screen"></div>
  </div>

  <!-- Bottom interactive entry system dock terminal shell frame -->
  <div id="bar">
    <span id="prompt">▶</span>
    <input id="input" autocomplete="off" autofocus />
  </div>

  <script src="client.js"></script>
</body>
</html>
